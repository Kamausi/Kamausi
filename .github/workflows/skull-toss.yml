name: Skull Toss spec
on:
  push:
    paths: ["skull-toss/**", ".github/workflows/skull-toss.yml"]
  pull_request:
    paths: ["skull-toss/**", ".github/workflows/skull-toss.yml"]
jobs:
  spec:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    defaults:
      run:
        working-directory: skull-toss
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Build (release, dev, with music)
        run: |
          python3 src/build.py
          python3 src/build.py --dev
          python3 src/build.py --with-music
          ! grep -q "setBones" index.html
      - name: The server's rules (firebase/functions, no install needed)
        run: node --test firebase/functions/test/*.test.js
      - name: The shells parse
        run: |
          node --check platforms/electron/main.js
          node --check platforms/electron/preload.js
          node --check firebase/functions/index.js
          node --check firebase/functions/tools/admin.js
      - name: Install Playwright and ESLint
        working-directory: skull-toss/tools
        run: |
          npm install --no-save --no-package-lock playwright@1.56.1 eslint@9
          npx playwright install --with-deps chromium
      - name: Lint the assembled game
        run: node tools/lint.mjs
      - name: Run the spec
        run: node tools/run-spec.mjs
      - name: The device matrix
        run: node tools/matrix.mjs
      - name: The soak test
        run: node tools/soak.mjs 4
      - name: Package the web build
        run: |
          python3 tools/package.py web
          test -f dist/web/sw.js && test -f dist/web/manifest.webmanifest && grep -q 'rel="manifest"' dist/web/index.html
