name: Skull Toss spec
on:
  push:
    paths: ["skull-toss/**", ".github/workflows/skull-toss.yml"]
  pull_request:
    paths: ["skull-toss/**", ".github/workflows/skull-toss.yml"]
jobs:
  spec:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    defaults:
      run:
        working-directory: skull-toss
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Build (release, dev, with music)
        run: |
          python3 src/build.py
          python3 src/build.py --dev
          python3 src/build.py --with-music
          ! grep -q "setBones" index.html
      - name: The server's rules (firebase/functions, no install needed)
        run: node --test firebase/functions/test/*.test.js
      - name: The shells parse
        run: |
          node --check platforms/electron/main.js
          node --check platforms/electron/preload.js
          node --check firebase/functions/index.js
          node --check firebase/functions/tools/admin.js
      - name: Install Playwright and ESLint
        working-directory: skull-toss/tools
        run: |
          npm install --no-save --no-package-lock playwright@1.56.1 eslint@9
          npx playwright install --with-deps chromium
      - name: Lint the assembled game
        run: node tools/lint.mjs
      - name: Run the spec
        run: node tools/run-spec.mjs
      - name: The device matrix
        run: node tools/matrix.mjs
      - name: The soak test
        run: node tools/soak.mjs 4
      - name: The persistence audit
        run: node tools/persistence.mjs
      - name: The end-to-end regression
        run: node tools/e2e.mjs
      - name: Package the web build
        run: |
          python3 tools/package.py web
          test -f dist/web/sw.js && test -f dist/web/manifest.webmanifest && grep -q 'rel="manifest"' dist/web/index.html

  # Deploy to Firebase (hosting, and the Firestore rules) once everything above has passed on a push to the working
  # branch. It needs one repository secret, FIREBASE_SERVICE_ACCOUNT: the JSON key from the Firebase console
  # (Project settings → Service accounts → Generate new private key). Without it, this job says so and does nothing.
  deploy:
    needs: spec
    if: github.event_name == 'push' && github.ref == 'refs/heads/claude/v14-roadmap-audit-3ger3u'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: skull-toss
    steps:
      - uses: actions/checkout@v4
      - name: Is there a deploy key?
        id: key
        env:
          SA: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          if [ -z "$SA" ]; then echo "No FIREBASE_SERVICE_ACCOUNT secret yet: nothing to deploy."; echo "go=false" >> "$GITHUB_OUTPUT"; else echo "go=true" >> "$GITHUB_OUTPUT"; fi
      - uses: actions/setup-python@v5
        if: steps.key.outputs.go == 'true'
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        if: steps.key.outputs.go == 'true'
        with:
          node-version: "22"
      - uses: google-github-actions/auth@v2
        if: steps.key.outputs.go == 'true'
        with:
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
      - name: Package the web build
        if: steps.key.outputs.go == 'true'
        run: python3 tools/package.py web
      - name: Deploy the site
        if: steps.key.outputs.go == 'true'
        working-directory: skull-toss/firebase
        run: |
          PROJECT=$(jq -r .project_id "$GOOGLE_APPLICATION_CREDENTIALS")
          echo "Project: $PROJECT"
          npx --yes firebase-tools@15 deploy --only hosting --project "$PROJECT" --non-interactive
          echo "Live at https://$(jq -r .hosting.site firebase.json).web.app"
      - name: Deploy the Firestore rules and indexes (once the database exists)
        if: steps.key.outputs.go == 'true'
        continue-on-error: true
        working-directory: skull-toss/firebase
        run: npx --yes firebase-tools@15 deploy --only firestore --project "$(jq -r .project_id "$GOOGLE_APPLICATION_CREDENTIALS")" --non-interactive
