name: Skull Toss spec
on:
  push:
    paths: ["skull-toss/**", ".github/workflows/skull-toss.yml"]
  pull_request:
    paths: ["skull-toss/**", ".github/workflows/skull-toss.yml"]
jobs:
  spec:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: skull-toss
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Build (release, dev, with music)
        run: |
          python3 src/build.py
          python3 src/build.py --dev
          python3 src/build.py --with-music
          ! grep -q "setBones" index.html
      - name: Install Playwright
        working-directory: skull-toss/tools
        run: |
          npm install --no-save --no-package-lock playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Run the spec
        run: node tools/run-spec.mjs
